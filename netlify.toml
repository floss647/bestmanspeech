# Netlify build + hosting config for the Vite SPA.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Single-page app: every route must serve index.html so React Router can handle
# it client-side. Without this, deep links like /checkout or /about would 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Sensible default security headers.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
