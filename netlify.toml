# Netlify build + hosting config for the Vite SPA.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Marketing pages are prerendered to real HTML at build time (scripts/prerender.mjs)
# and Netlify serves those files directly. Everything else (/write, /checkout, …)
# falls back to the empty app shell, which React renders client-side.
[[redirects]]
  from = "/*"
  to = "/app.html"
  status = 200

# Sensible default security headers.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
