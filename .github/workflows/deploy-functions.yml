name: Deploy Supabase functions

# Deploys the edge functions to Supabase whenever they change on main.
# Requires one repository secret: SUPABASE_ACCESS_TOKEN (a Supabase personal
# access token). The project ref is public and set below.
on:
  push:
    branches: [main, claude/lovabel-codebase-analysis-dr8qww]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: dooelzojlgrbatclrskz
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy all edge functions
        run: supabase functions deploy --project-ref "$PROJECT_REF"
